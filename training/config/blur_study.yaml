# Motion-blur LoRA fine-tuning study (see experiments/blur_study/README.md).
#
# Everything not marked "BLUR STUDY" is copied from the authors' released benchmark recipe in
# default.yaml / default_dataset.yaml (vggt_omega_1b_416_reproduce.pt). This file is standalone
# rather than inheriting default.yaml so that its EDEN entry cannot leak into the mixture.
#
# Launch (from training/):
#   torchrun --nproc_per_node=1 launch.py --config blur_study recipe=clean
#
# Paths default to the repository layout; override with the environment variables
# BLUR_STUDY_DATA (unified dataset root), BLUR_STUDY_DIR (schedule/splits) and
# BLUR_STUDY_CHECKPOINT, or with hydra overrides.
defaults:
  - default_dataset.yaml
  - _self_

recipe: clean  # BLUR STUDY: clean | fixed | variable | clean_or_heavy
exp_name: blur_study_${recipe}

data:
  train:
    # BLUR STUDY: replays one pass of the shared schedule per epoch instead of random draws.
    _target_: data.scheduled_dataset.ScheduledTorchDataset
    num_workers: 8
    dataset:
      _target_: data.scheduled_dataset.ScheduledBlurDataset
      schedule_path: ${oc.env:BLUR_STUDY_DIR,../experiments/blur_study}/schedule.json
      recipe: ${recipe}
      dataset_configs:
        uco3d:
          # Authors' uco3d entry from default.yaml, verbatim except paths.
          _target_: data.datasets.unified.UnifiedDataset
          UNIFIED_DIR: ${oc.env:BLUR_STUDY_DATA,../data/unified}/uco3d
          sequence_list_file: ${oc.env:BLUR_STUDY_DIR,../experiments/blur_study}/splits/uco3d_train.txt
          dataset_prefix: _uco3d
          is_synthetic: false
          mixture_weight: 152
          mixture_weight_scale: 1.0
          frame_window: 256
          max_interval: 64
          max_interval_ratio: -1
          max_depth: 256
          sample_by_index: true
          revisit_policy: avoid_if_possible
        hypersim:
          # The authors released no Hypersim entry; this mirrors their synthetic (EDEN) entry,
          # with sample_by_index: true because no ranking.npy is distributed.
          _target_: data.datasets.unified.UnifiedDataset
          UNIFIED_DIR: ${oc.env:BLUR_STUDY_DATA,../data/unified}/hypersim
          sequence_list_file: ${oc.env:BLUR_STUDY_DIR,../experiments/blur_study}/splits/hypersim_train.txt
          dataset_prefix: _hypersim
          is_synthetic: true
          mixture_weight: 177
          mixture_weight_scale: 1.0
          frame_window: 80
          frame_window_policy: frame_count_power_law
          max_interval_ratio: -1
          jump_prob: 0
          sample_by_index: true
          revisit_policy: avoid_if_possible
        mvssynth:
          # Same EDEN-style synthetic entry as hypersim.
          _target_: data.datasets.unified.UnifiedDataset
          UNIFIED_DIR: ${oc.env:BLUR_STUDY_DATA,../data/unified}/mvssynth
          sequence_list_file: ${oc.env:BLUR_STUDY_DIR,../experiments/blur_study}/splits/mvssynth_train.txt
          dataset_prefix: _mvssynth
          is_synthetic: true
          mixture_weight: 177
          mixture_weight_scale: 1.0
          frame_window: 80
          frame_window_policy: frame_count_power_law
          max_interval_ratio: -1
          jump_prob: 0
          sample_by_index: true
          revisit_policy: avoid_if_possible
    common_config:
      # BLUR STUDY: ten views per sample; the scheduled loader fixes the sequence, frames and
      # aspect ratio, so random sequence selection is disabled. Batch size (3 sequences, the
      # authors' FRAME_COUNT_TO_BATCH_SIZE[10]) is stored in the schedule.
      frames_per_sample_range: [10, 10]
      fix_img_num: 10
      inside_random: false
      # img_size: 416 and the augmentation block are inherited unchanged from default_dataset.yaml.

model:
  _target_: vggt_omega.models.VGGTOmega
  patch_size: 16
  embed_dim: 1024
  enable_camera: true
  enable_depth: true
  enable_alignment: false
  use_checkpoint: true
  autocast: false

# BLUR STUDY: LoRA adapters; every original parameter is frozen.
lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules:
    - aggregator.frame_blocks.*
    - aggregator.inter_frame_blocks.*
    - camera_head.*

loss:
  _target_: losses.loss.MultitaskLoss
  normalize_predictions: false
  normalize_gt: global
  rel_to_first_cam: false
  intrinsics_warmup_ratio: 0.6
  camera:
    weight: 5.0
    weight_trans: 2.0
    weight_rot: 1.0
    weight_focal: 1.0
    normalize_trans_by_gt_scale: true
    weight_pairwise: 1.0
    pairwise_weight_rotation: 1.0
    pairwise_weight_translation: 1.0
  depth:
    weight: 5.0
    weight_normal: 1.0
    min_valid_pts: 100
    abs_l1_loss_ratio: 1.0
    rel_l1_loss_ratio: 0.2
    max_pixel_loss: 100.0
    use_conf_loss: true
    conf_alpha: 0.2
    add_separate_reg_loss: true
    separate_reg_loss_weight: 1.0
    apply_aux_loss_to_synthetic_only: true
    gradient_loss_config:
      - type: normal
        scales: 1
        min_valid_samples: 100
        weight: 0.1
      - type: grad
        scales: 4
        weight: 1.0
  point:
    weight: 5.0
    min_valid_pts: 100
    abs_l1_loss_ratio: 1.0
    rel_l1_loss_ratio: 0.2
    max_pixel_loss: 100.0
  track:
    weight: 5.0
    max_pixel_loss: 1000.0
    min_valid_pixels: 100

optim:
  filter_bias_and_bn: true
  frozen_module_names: null
  frozen_param_names: null

  optimizer:
    _target_: torch.optim.AdamW
    lr: 2.0e-04
    weight_decay: 0.05
    betas: [0.9, 0.95]

  amp:
    enabled: true
    amp_dtype: bfloat16

  gradient_clip:
    _target_: train_utils.gradient_clip.GradientClipper
    configs:
      - module_name: [aggregator, patch_embed]
        max_norm: 1.0
        norm_type: 2
      - module_name: [dense_head]
        max_norm: 1.0
        norm_type: 2
      - module_name: [camera_head]
        max_norm: 1.0
        norm_type: 2

  options:
    lr:
      - scheduler:
          _target_: fvcore.common.param_scheduler.CompositeParamScheduler
          schedulers:
            - _target_: fvcore.common.param_scheduler.LinearParamScheduler
              start_value: 5.0e-07
              end_value: 2.0e-04
            - _target_: fvcore.common.param_scheduler.CosineParamScheduler
              start_value: 2.0e-04
              end_value: 5.0e-07
          lengths: [0.05, 0.95]
          interval_scaling: [rescaled, rescaled]
      # BLUR STUDY: the authors' 0.1x "*patch_embed*" group is dropped because the patch
      # embed is frozen (the pattern would match nothing and construct_optimizer raises).
    weight_decay:
      - scheduler:
          _target_: fvcore.common.param_scheduler.ConstantParamScheduler
          value: 0.05

checkpoint:
  save_dir: logs/${exp_name}/checkpoints
  save_freq: 5
  dinov3_weight_path: null
  dinov3_weight_strict: true
  # BLUR STUDY: start from the benchmark reproduction checkpoint, loaded strictly.
  model_weight_path: ${oc.env:BLUR_STUDY_CHECKPOINT,../checkpoint/vggt_omega_1b_416_reproduce.pt}
  model_weight_strict: true

logging:
  log_dir: logs/${exp_name}/logs
  log_freq: 1
  log_level_primary: INFO
  log_level_secondary: WARNING
  all_ranks: false
  tensorboard_writer:
    _target_: train_utils.tb_writer.TensorBoardLogger
    path: logs/${exp_name}/tensorboard
  scalar_keys_to_log:
    train:
      keys_to_log:
        - loss_objective
        - loss_camera
        - loss_T
        - loss_R
        - loss_FL
        - loss_PW
        - Rac_5
        - Rac_15
        - Tac_5
        - Tac_15
        - Auc_3
        - Auc_5
        - Auc_10
        - Auc_30
        - loss_depth
        - loss_reg_depth
        - loss_conf_depth
        - loss_normal
        - abs_rel
        - loss_point
        - loss_consistency

distributed:
  backend: nccl  # BLUR STUDY: override with distributed.backend=gloo on Windows
  find_unused_parameters: false
  timeout_mins: 30
  gradient_as_bucket_view: true
  bucket_cap_mb: 25
  broadcast_buffers: true

cuda:
  allow_tf32: false
  cudnn_deterministic: false
  cudnn_benchmark: false

strategy: ddp
fsdp_settings: null

# BLUR STUDY: five passes over the 450 training recordings, 150 batches of 3 per pass.
max_epochs: 5
limit_train_batches: 150
accum_steps: 1
seed_value: 264813
start_epoch: 0
env_variables: null
